########################################
# T0_FILAMENT_JAM_SENSOR.cfg
# Common Filament Sensor related Configuration for all printer variants
# Author: Vijay Raghav Varada
# Version: 1
########################################

########################################
# Filament Sensor Hardware Configuration
########################################

[filament_motion_sensor encoder_sensor_T0]
switch_pin: ^PF3
detection_length: 12 #2.88 # accuracy of motion sensor 2.88mm
extruder: extruder
pause_on_runout: False
runout_gcode:
    {% set saved_vars = printer.save_variables.variables %}
    {% set printer_vars = printer["gcode_macro PRINTER_VARIABLES"]|default({}) %}
    ; Check if this is a dual material bay printer
    {% set has_dual_bay = saved_vars.has_dual_material_bay|default(0) == 1 or printer_vars.has_dual_material_bay|default(0) == 1 %}
    {% set active_bay = saved_vars.active_material_bay|default('A') %}
    ; DEBUG: Log when encoder sensor triggers (even if suppressed)
    RESPOND TYPE=echo MSG="DEBUG encoder_sensor_T0: triggered, homed={printer.toolhead.homed_axes}, extruder={printer.toolhead.extruder}, dual_bay={has_dual_bay}, active={active_bay}"
    ; Only trigger if: homed, extruder active, AND (not dual bay OR dual bay with Bay A active)
    {% if printer.toolhead.homed_axes == "xyz" and printer.toolhead.extruder == "extruder" %}
        {% if not has_dual_bay or active_bay == 'A' %}
            RESPOND TYPE=echo MSG="Filament Jam Detected on T0"
        {% endif %}
    {% endif %}

[delayed_gcode SET_T0_FILAMENT_JAM_SENSOR_STARTUP]
initial_duration: 1
gcode:
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor_T0 ENABLE=0