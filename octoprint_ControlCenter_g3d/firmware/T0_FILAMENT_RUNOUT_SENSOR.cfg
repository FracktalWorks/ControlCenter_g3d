########################################
# T0_FILAMENT_RUNOUT_SENSOR.cfg
# Common Filament Sensor related Configuration for all printer variants
# Author: Vijay Raghav Varada
# Version: 1
########################################

########################################
# Filament Sensor Hardware Configuration
########################################

[filament_switch_sensor switch_sensor_T0]
# M8P V2.0 M3-STOP header = PF2
switch_pin: ^PF2
pause_on_runout: False
runout_gcode:
    {% if printer.toolhead.homed_axes == "xyz" and printer.toolhead.extruder == "extruder" %}
        RESPOND TYPE=echo MSG="Filament Runout Detected on T0 — pausing print"
        PAUSE
    {% else %}
        RESPOND TYPE=echo MSG="switch_sensor_T0 triggered (ignored — not printing)"
    {% endif %}
insert_gcode:
    RESPOND TYPE=echo MSG="Filament Inserted on T0"

[delayed_gcode SET_T0_FILAMENT_RUNOUT_SENSOR_STARTUP]
initial_duration: 1
gcode:
    SET_FILAMENT_SENSOR SENSOR=switch_sensor_T0 ENABLE=0