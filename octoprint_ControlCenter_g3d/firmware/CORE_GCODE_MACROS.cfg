########################################
# CORE_GCODE_MACROS.cfg
# Common G-code Macros for all printer variants
# Author: Vijay Raghav Varada
# Version: 5.0
########################################

########################################
# Save Variables
########################################

[save_variables]
filename: /home/pi/variables.cfg

########################################
# Exclude Objects
########################################

[exclude_object]

########################################
# G29 - Bed Leveling
########################################

[gcode_macro G29]
gcode:
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    BED_MESH_CALIBRATE
    BED_MESH_PROFILE SAVE=default

########################################
# Z Probe Offset Calibration Macros
# Usage via OctoPrint terminal:
#   1. Z_OFFSET_CALIBRATE_START  — homes + starts probe calibration session
#   2. Z_OFFSET_DOWN / Z_OFFSET_DOWN_FINE   — nudge nozzle toward bed
#   3. Z_OFFSET_UP   / Z_OFFSET_UP_FINE     — nudge nozzle away from bed
#   4. Z_OFFSET_SAVE                         — accept result and save to config
########################################

[gcode_macro Z_OFFSET_CALIBRATE_START]
description: Home all axes then start BLTouch Z offset calibration
gcode:
    G28
    RESPOND TYPE=echo MSG="Homed. Starting PROBE_CALIBRATE — use Z_OFFSET_DOWN/UP to adjust, then Z_OFFSET_SAVE when paper has slight drag."
    PROBE_CALIBRATE

[gcode_macro Z_OFFSET_DOWN]
description: Nudge nozzle down 0.1mm during Z offset calibration (coarse)
gcode:
    TESTZ Z=-0.1

[gcode_macro Z_OFFSET_DOWN_FINE]
description: Nudge nozzle down 0.025mm during Z offset calibration (fine)
gcode:
    TESTZ Z=-0.025

[gcode_macro Z_OFFSET_UP]
description: Nudge nozzle up 0.1mm during Z offset calibration (coarse)
gcode:
    TESTZ Z=+0.1

[gcode_macro Z_OFFSET_UP_FINE]
description: Nudge nozzle up 0.025mm during Z offset calibration (fine)
gcode:
    TESTZ Z=+0.025

[gcode_macro Z_OFFSET_SAVE]
description: Accept current Z offset and write to printer.cfg
gcode:
    ACCEPT
    SAVE_CONFIG

########################################
# Force Move — Z axis manual movement (no homing required)
########################################

[gcode_macro FORCE_Z_UP_50]
description: Force move Z up 50mm — no homing needed.
gcode:
    FORCE_MOVE STEPPER=stepper_z DISTANCE=50 VELOCITY=5

########################################
# BLTouch Testing Macros
########################################

[gcode_macro BLTOUCH_PIN_DOWN]
description: Deploy BLTouch probe pin
gcode:
    BLTOUCH_DEBUG COMMAND=pin_down

[gcode_macro BLTOUCH_PIN_UP]
description: Retract BLTouch probe pin
gcode:
    BLTOUCH_DEBUG COMMAND=pin_up

[gcode_macro BLTOUCH_QUERY]
description: Query current probe/BLTouch state (open or triggered)
gcode:
    QUERY_PROBE

[gcode_macro BLTOUCH_RESET]
description: Reset BLTouch (clears fault/error state)
gcode:
    BLTOUCH_DEBUG COMMAND=reset

[gcode_macro BLTOUCH_SELF_TEST]
description: Run BLTouch built-in self-test sequence
gcode:
    BLTOUCH_DEBUG COMMAND=self_test

########################################
# M290 - Babystep Z
########################################

[gcode_macro M290]
gcode:
    {% set z = params.Z|default(0)|float %}
    SET_GCODE_OFFSET Z_ADJUST={z} MOVE=1
    SAVE_VARIABLE VARIABLE=babystep_z VALUE={printer.gcode_move.homing_origin.z + z}

########################################
# M420 - Bed Leveling State
########################################

[gcode_macro M420]
gcode:
    {% set s = params.S|default(0)|int %}
    {% if s == 1 %}
        BED_MESH_PROFILE LOAD=default
    {% else %}
        BED_MESH_CLEAR
    {% endif %}

########################################
# M500 - Save Settings
########################################

[gcode_macro M500]
gcode:
    SAVE_CONFIG

########################################
# M503 - Report Settings
########################################

[gcode_macro M503]
gcode:
    RESPOND TYPE=echo MSG="Saved Variables: {printer.save_variables.variables}"

########################################
# M218 - Set Hotend Offset
########################################

[gcode_macro M218]
gcode:
    {% set t = params.T|default(0)|int %}
    {% set x = params.X|default(0)|float %}
    {% set y = params.Y|default(0)|float %}
    {% set z = params.Z|default(0)|float %}
    {% if t == 1 %}
        SET_GCODE_OFFSET X={x} Y={y} Z={z}
        SAVE_VARIABLE VARIABLE=t1_offset_x VALUE={x}
        SAVE_VARIABLE VARIABLE=t1_offset_y VALUE={y}
        SAVE_VARIABLE VARIABLE=t1_offset_z VALUE={z}
    {% endif %}

########################################
# M851 - Z Probe Offset
########################################

[gcode_macro M851]
gcode:
    {% set z = params.Z|default(0)|float %}
    SET_GCODE_OFFSET Z={z}
    SAVE_VARIABLE VARIABLE=probe_z_offset VALUE={z}

########################################
# M190 - Set Bed Temperature and Wait
########################################

[gcode_macro M190]
rename_existing: M190.1
gcode:
    {% set temp = params.S|default(0)|float %}
    {% set r = params.R|default(0)|float %}
    {% if r > 0 %}
        M190.1 R{r}
    {% else %}
        M190.1 S{temp}
    {% endif %}

########################################
# M900 - Linear Advance
########################################

[gcode_macro M900]
gcode:
    {% set k = params.K|default(0)|float %}
    SET_PRESSURE_ADVANCE ADVANCE={k}

########################################
# Homing Override
# BL-Touch is Z virtual endstop — XY must be homed before Z.
# Sequence: X → Y → move to safe centre → Z probe → lift 10mm
########################################

[homing_override]
axes: xyz
set_position_z: 0
gcode:
    {% set home_x = 'X' in params %}
    {% set home_y = 'Y' in params %}
    {% set home_z = 'Z' in params %}
    {% set home_all = not home_x and not home_y and not home_z %}
    # Safe XY position for Z probing — centre of 1M×1M bed.
    # Update these values if axis limits change.
    {% set safe_x = 500 %}
    {% set safe_y = 500 %}

    # Safety lift: raise Z 5mm relative before any XY movement to prevent
    # nozzle dragging on the bed. Uses set_position_z: 0 as the reference.
    G91
    G0 Z5 F600
    G90

    {% if home_all %}
        G28 X
        G28 Y
        G0 X{safe_x} Y{safe_y} F9000
        G28 Z
        G0 Z10 F600
    {% else %}
        {% if home_x %}
            G28 X
        {% endif %}
        {% if home_y %}
            G28 Y
        {% endif %}
        {% if home_z %}
            {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
                RESPOND TYPE=error MSG="Home X and Y before homing Z (BL-Touch needs a known XY position to probe from)"
            {% else %}
                G0 X{safe_x} Y{safe_y} F9000
                G28 Z
                G0 Z10 F600
            {% endif %}
        {% endif %}
    {% endif %}

########################################
# Filament Sensor Enable/Disable Macros
########################################

[gcode_macro ENABLE_FILAMENT_SENSORS]
gcode:
    SET_FILAMENT_SENSOR SENSOR=switch_sensor_T0 ENABLE=1
    RESPOND TYPE=echo MSG="Filament runout sensor enabled"

[gcode_macro DISABLE_FILAMENT_SENSORS]
gcode:
    SET_FILAMENT_SENSOR SENSOR=switch_sensor_T0 ENABLE=0
    RESPOND TYPE=echo MSG="Filament runout sensor disabled"

[gcode_macro FILAMENT_SENSOR_STATUS]
description: Query the filament runout sensor (switch_sensor_T0 on M3-STOP/PF2)
gcode:
    QUERY_FILAMENT_SENSOR SENSOR=switch_sensor_T0

########################################
# PRINT_START / PRINT_END
########################################

[gcode_macro PRINT_START]
gcode:
    {% set bed_temp = params.BED|default(60)|float %}
    {% set extruder_temp = params.EXTRUDER|default(200)|float %}
    {% set chamber_temp = params.CHAMBER|default(0)|float %}

    M140 S{bed_temp}                        ; Start bed heating
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder_side0 MOTION_QUEUE=extruder  ; Ensure motor-side stepper is synced
    G28                                      ; Home all axes
    M190 S{bed_temp}                         ; Wait for bed temp
    G29                                      ; Bed mesh
    M420 S1                                  ; Load mesh
    G1 Z5 F3000                              ; Move Z up
    M104 S{extruder_temp}                    ; Start extruder heating
    G1 X0 Y0 F7000                           ; Move to start position
    M109 S{extruder_temp}                    ; Wait for extruder temp
    ENABLE_FILAMENT_SENSORS                  ; Enable sensors
    G92 E0                                   ; Reset extruder

[gcode_macro PRINT_END]
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    G91                                      ; Relative positioning
    G1 E-2 F2700                             ; Retract
    G1 Z5 F3000                              ; Raise Z
    G90                                      ; Absolute positioning
    G1 X{printer_var.tool0_pause_position_x} Y{printer_var.bed_y_max} F9000  ; Park
    M104 S0                                  ; Turn off extruder
    M140 S0                                  ; Turn off bed
    M106 S0                                  ; Turn off fan
    DISABLE_FILAMENT_SENSORS                 ; Disable sensors
    M84                                      ; Disable steppers