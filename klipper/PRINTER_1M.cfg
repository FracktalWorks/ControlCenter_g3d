########################################
# PRINTER_1M.cfg
# 900x1000x700mm Custom Printer Configuration
# Author: Vijay Raghav Varada
# Version: 1.0
########################################

[include CORE_GCODE_MACROS.cfg]
[include BASE_DRAGON.cfg]
[include T0_FILAMENT_RUNOUT_SENSOR.cfg]
# Toolhead config — comment in once toolheads are connected
[include TOOLHEADS_TD-01_TOOLHEAD0.cfg]

########################################
# Printer Variables
########################################

[gcode_macro PRINTER_VARIABLES]
variable_bed_x_max: 900
variable_bed_y_max: 1000
variable_bed_z_max: 700
variable_fan0: 'extruder_CF'
variable_tool0_pause_position_x: 10
variable_tool0_pause_position_y: 10
variable_is_dual_nozzle: 0
variable_ptfe_tube_length: 2270
variable_bed_calibration_x1: 50
variable_bed_calibration_y1: 100
variable_bed_calibration_x2: 850
variable_bed_calibration_y2: 100
variable_bed_calibration_x3: 450
variable_bed_calibration_y3: 900
variable_bed_calibration_x4: 450
variable_bed_calibration_y4: 500
variable_feedrate: 9000
gcode:

########################################
# Printer Config
########################################

[printer]
kinematics: cartesian
max_velocity: 150
max_accel: 500
minimum_cruise_ratio: 0
square_corner_velocity: 5
max_z_velocity: 20
max_z_accel: 100

########################################
# X Axis Limits
# Endstop: STOP_0 (^!PF4), homes to X max
########################################

[stepper_x]
position_endstop: 1050
position_min: 0
position_max: 1050

########################################
# Y Axis Limits
# Endstop: STOP_1 (^!PF3), homes to Y max
########################################

[stepper_y]
position_endstop: 1080
position_min: 0
position_max: 1080

########################################
# Z Axis Limits
# No position_endstop — uses BL-Touch (probe:z_virtual_endstop)
# position_min is -5.0 (set in BASE_DRAGON.cfg for z_offset calibration)
########################################

[stepper_z]
position_max: 630

########################################
# Resonance Tester
########################################

# Resonance tester — comment in once toolhead ADXL345 is connected
[resonance_tester]
probe_points: 450, 500, 20
accel_chip: adxl345 toolhead0

########################################
# Bed Mesh
########################################

[bed_mesh]
# mesh_min/max are PROBE positions.
# X min 300mm probe → nozzle at X=264 (300-36). Y min 150mm probe → nozzle at Y=100 (150-50).
mesh_min: 300, 150
mesh_max: 750, 850
probe_count: 4, 4
speed: 200
